name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Do not rename this job. Its key is the name of a required status check on
  # main, in the protect-main ruleset, so a rename leaves that check waiting for
  # a report that never comes and no pull request can merge.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version test compares the working version against every release
          # tag. A default checkout fetches no tags, so the test would see an
          # empty list and pass without examining anything.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Every gate lives in the script, so this job stays reproducible locally.
      - name: Run the shared gate
        run: bash scripts/check.sh
