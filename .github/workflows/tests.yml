name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Every gate lives in the script, so this job stays reproducible locally.
      - name: Run the shared gate
        run: bash scripts/check.sh
