# A pull request description is text a reader receives, so this plugin's own
# audit reads it. The decision lives in the program that
# scripts/audit-pull-request-text.sh starts, and this file only fetches the
# description and hands it over, so that a
# contributor can reproduce a result here with one local command.
#
# Findings are advice. They appear in the job's log and on its summary page,
# and they never fail this job. It fails only when the description is empty or
# holds only whitespace, or when the audit did not run. A pass therefore means
# the audit ran, not that the description is clear.
name: Pull request text

on:
  pull_request:
    # Edited as well as pushed, because a description changes without a commit.
    types: [opened, edited, reopened, synchronize]

jobs:
  # Do not rename this job. Its key is the name of a required status check on
  # main, in the protect-main ruleset, so a rename leaves that check waiting for
  # a report that never comes and no pull request can merge.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Audit the description
        # Passed as an environment variable rather than written into the script,
        # so a description cannot become part of the command that reads it.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          bash scripts/audit-pull-request-text.sh "$RUNNER_TEMP/pull-request.md"
